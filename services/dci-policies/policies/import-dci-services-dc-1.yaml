# WAN import on DC1 DCI BGP peers — EVPN RIC stitch + L2 type-2/3.
# SROS: no fabric-isolation rejects needed; explicit stitch RT allow-list only.
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata:
  name: import-dci-services-dc-1
  namespace: clab-3-tier-leaf-spine-dcgw
  labels:
    eda.nokia.com/dci: evpn-wan
    eda.nokia.com/platform: sros
spec:
  defaultAction:
    policyResult: Reject
  statements:
    - name: reject-dc1-soo-evpn
      action:
        policyResult: Reject
      match:
        families:
          - EVPN
        bgp:
          communitySet: soo-1122
    - name: accept-remote-l2-type-2-evpn
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-l2-import-dc1
          evpnRouteTypes:
            - 2
    - name: accept-remote-l2-type-3-evpn
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-l2-import-dc1
          evpnRouteTypes:
            - 3
    - name: accept-remote-l3-evpn-type-1
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 1
    - name: accept-remote-l3-evpn-type-2
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 2
    - name: accept-remote-l3-evpn-type-3
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 3
    - name: accept-remote-l3-evpn-type-4
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 4
    - name: accept-remote-l3-evpn-type-5
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-dc2-l3
          evpnRouteTypes:
            - 5
    - name: accept-remote-vnet-5-evpn-type-1
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-vnet-5-stitch
          evpnRouteTypes:
            - 1
    - name: accept-remote-vnet-5-evpn-type-2
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-vnet-5-stitch
          evpnRouteTypes:
            - 2
    - name: accept-remote-vnet-5-evpn-type-3
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-vnet-5-stitch
          evpnRouteTypes:
            - 3
    - name: accept-remote-vnet-5-evpn-type-4
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-vnet-5-stitch
          evpnRouteTypes:
            - 4
    - name: accept-remote-vnet-5-evpn-type-5
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        families:
          - EVPN
        bgp:
          communitySet: dci-rt-vnet-5-stitch
          evpnRouteTypes:
            - 5
    - name: reject-all-remote-evpn
      action:
        policyResult: Reject
      match:
        families:
          - EVPN
    - name: accept-remote-hub-bgp-vpn
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        protocol: BGP_VPN
        families:
          - IPv4
        bgp:
          communitySet: dci-rt-dc2-l3
    - name: accept-remote-vnet-5-bgp-vpn
      action:
        policyResult: Accept
        tags:
          applyTagSet: tag-20
      match:
        protocol: BGP_VPN
        families:
          - IPv4
        bgp:
          communitySet: dci-rt-vnet-5-stitch
